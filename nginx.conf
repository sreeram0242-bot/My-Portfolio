server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for high performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # Media files & static assets caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|mp4|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Clean routing for static files and demos
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # Deny hidden files like .git
    location ~ /\. {
        deny all;
    }
}
